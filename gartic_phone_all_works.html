    <style>
        body {
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
            overflow-x: hidden;
            user-select: none;
            color: #f3e8ff;
        }
        .stripe-banner {
            position: absolute; top: 0; left: 0; right: 0; height: 160px;
            background: linear-gradient(90deg, #181522 0%, #252033 50%, #15121c 100%);
            transform: skewY(-4deg); z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-bottom: 4px solid #0a080f;
        }
        ::-webkit-scrollbar { width: 18px; }
        ::-webkit-scrollbar-track {
            background: linear-gradient(90deg, #121019 0%, #1c1829 50%, #121019 100%);
            border-left: 2px solid rgba(168, 85, 247, 0.2);
            border-right: 2px solid rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 50%, #581c87 100%);
            border-radius: 10px; border: 3px solid #1a1625;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -3px 6px rgba(0, 0, 0, 0.6), 0 4px 10px rgba(168, 85, 247, 0.4);
            min-height: 50px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #c084fc 0%, #9333ea 50%, #6b21a8 100%);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.6), 0 0 15px rgba(192, 132, 252, 0.7);
        }
        ::-webkit-scrollbar-thumb:active {
            background: linear-gradient(135deg, #6b21a8 0%, #581c87 50%, #3b0764 100%);
            border-width: 4px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.8), 0 0 5px rgba(168, 85, 247, 0.2);
        }
        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-avatar {
            animation: popIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #fde047;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Стили для всплывающих эффектов частиц */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: particleFly 0.8s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }
    </style>
</head>

// =======================================================================
function setHolidayBackground() {
    const now = new Date();
    const m = now.getMonth() + 1; // 1-12
    const d = now.getDate();
    let bgFile = 'user/system/yu.png'; // По умолчанию

    if (m === 5 && d === 21) bgFile = 'user/system/yu_creator_bd.png';      
    else if (m === 7 && d === 13) bgFile = 'user/system/yu_hunter_bd.png';   
    else if (m === 4 && d === 1) bgFile = 'user/system/yu_april1.png';       
    else if (m === 4 && d === 12) bgFile = 'user/system/yu_space.png';       
    else if (m === 5 && d === 9) bgFile = 'user/system/yu_may9.png';         
    else if (m === 8 && d === 20) bgFile = 'user/system/yu_sloth.png';       
    else if (m === 9 && d === 1) bgFile = 'user/system/yu_sept1.png';        
    else if (m === 10 && d === 5) bgFile = 'user/system/yu_teacher.png';     
    else if (m === 3 && d === 8) bgFile = 'user/system/yu_march8.png';       
    else if ((m === 12 && d >= 21) || (m === 1 && d <= 1)) bgFile = 'user/system/yu_newyear.png'; 
    else if (m === 10) bgFile = 'user/system/yu_halloween.png';              

    document.body.style.backgroundImage = `url('${bgFile}')`;
}
setHolidayBackground();

            </div>
        </div>
    </div>

    <div id="filter-modal" class="fixed inset-0 bg-purple-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-purple-950 border-4 border-yellow-400 rounded-3xl p-6 max-w-sm w-full shadow-2xl relative text-white">
            <button onclick="closeFilterModal()" class="absolute top-4 right-4 w-9 h-9 bg-red-600 hover:bg-red-500 rounded-full font-bold text-white flex items-center justify-center cursor-pointer shadow">✕</button>
            <h3 class="text-xl font-black mb-4 text-center text-yellow-300">🔍 Фильтр по дате</h3>
            <div id="filter-years-list" class="space-y-2 max-h-60 overflow-y-auto mb-4 pr-1"></div>
            <button onclick="applyYearFilter(null)" class="w-full bg-purple-950 border-2 border-purple-500 text-purple-200 font-bold py-2.5 rounded-xl text-xs cursor-pointer">Сбросить фильтр</button>
        </div>
    </div>

    <script>
        const monthNames = {'01':'Января','02':'Февраля','03':'Марта','04':'Апреля','05':'Мая','06':'Июня','07':'Июля','08':'Августа','09':'Сентября','10':'Октября','11':'Ноября','12':'Декабря'};
        const modeTitles = {'all':'ВСЕ РАБОТЫ','classic':'КЛАССИКА','anime':'АНИМАЦИЯ','forsecret':'СЕКРЕТ','plagiarist':'ПЛАГИАТ','express':'ЭКСПРЕСС','icebreaker':'ЛЕДОКОЛ','sandwich':'СЭНДВИЧ','addendum':'ДОПОЛНЕНИЕ','missing':'НЕДОСТАЮЩАЯ ЧАСТЬ','ochko':'СЧЁТ','tolpa':'ТОЛПА','history':'ИСТОРИЯ'};
        
        let dbItems = [];
        let currentAccountIdx = 0;
        let currentSubProfileIdx = 0;
        let currentMode = 'all';
        let selectedFilterDate = null;
        let currentDisplayedItems = [];
        let currentModalIdx = 0; // Индекс просматриваемой работы в модальном окне
        let typingTimer;

        // Переменная для отслеживания состояния музыки перед просмотром видео
        let wasMusicPlayingBeforeVideo = false;

        // =======================================================================
        // 🎀 ЛОКАЛЬНОЕ ХРАНИЛИЩЕ РЕАКЦИЙ И КУБКОВ В БРАУЗЕРЕ (LOCALSTORAGE) 🎀
        // =======================================================================
        function getSavedReactions() {
            return JSON.parse(localStorage.getItem('gp_reactions_db') || '{}');
        }
        function saveReactions(data) {
            localStorage.setItem('gp_reactions_db', JSON.stringify(data));
        }

        function getAuthorTrophies(authorName) {
            const reactions = getSavedReactions();
            let count = 0;
            for (let itemKey in reactions) {
                if (reactions[itemKey].author === authorName && reactions[itemKey].trophy) {
                    count++;
                }
            }
            return count;
        }

        // ЭФФЕКТ ВЫЛЕТА АНИМИРОВАННЫХ ЧАСТИЦ (СЕРДЕЧКИ / БЛЁСТКИ)
        function createParticles(x, y, symbols, count = 12) {
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 60;
                const dx = Math.cos(angle) * distance + 'px';
                const dy = Math.sin(angle) * distance - 20 + 'px'; // чуть летит вверх
                
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.styleFloat = 'left';
                el.style.setProperty('--dx', dx);
                el.style.setProperty('--dy', dy);
                el.style.fontSize = (14 + Math.random() * 12) + 'px';

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 800);
            }
        }

        // Функции Музыкального Плеера
        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            const btnText = document.getElementById('musicText');
            const btnIcon = document.getElementById('musicIcon');

            if (audio.paused) {
                audio.play().then(() => {
                    btnText.textContent = 'Музыка: Вкл';
                    btnIcon.className = 'fas fa-pause';
                }).catch(err => {
                    console.log("Ошибка воспроизведения аудио:", err);
                });
            } else {
                audio.pause();
                btnText.textContent = 'Музыка: Выкл';
                btnIcon.className = 'fas fa-play';
            }
        }

        function updateVolume(value) {
            const audio = document.getElementById('bgMusic');
            const percentLabel = document.getElementById('volumePercent');
            const vol = parseFloat(value);
            if (audio) {
                audio.volume = vol; // Громкость до 100% (1.0)
            }
            if (percentLabel) {
                percentLabel.textContent = Math.round(vol * 100) + '%';
            }
        }

        // Автоматический запуск музыки при загрузке или обновлении страницы
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.volume = 0.5;
                audio.play().then(() => {
                    document.getElementById('musicText').textContent = 'Музыка: Вкл';
                    document.getElementById('musicIcon').className = 'fas fa-pause';
                }).catch(err => {
                    console.log("Автозапуск заблокирован браузером, ждем клика:", err);
                    const unlockAudio = () => {
                        audio.play().then(() => {
                            document.getElementById('musicText').textContent = 'Музыка: Вкл';
                            document.getElementById('musicIcon').className = 'fas fa-pause';
                            document.removeEventListener('click', unlockAudio);
                        });
                    };
                    document.addEventListener('click', unlockAudio);
                });
            }

            // Устанавливаем количество именно основных аккаунтов в фиолетовый квадратик
            const badgeEl = document.getElementById('mainArtistsCountBadge');
            if (badgeEl) {
                badgeEl.textContent = KatyaGallery.length;
            }
        });

        // Горячие клавиши (← и → для перелистывания, Esc для закрытия)
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('fullsize-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') prevModalItem();
                if (e.key === 'ArrowRight') nextModalItem();
                if (e.key === 'Escape') closeFullSizeModal();
            }
        });

        // =======================================================================
        // 🎀 ЛОГИКА ПОИСКА ХУДОЖНИКОВ (КАК GOOGLE) 🎀
        // =======================================================================
        function handleSearchInput(query) {
            const dropdown = document.getElementById('searchResultsDropdown');
            const q = query.trim().toLowerCase();
            
            if (!q) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                return;
            }

            let results = [];
            KatyaGallery.forEach((acc, aIdx) => {
                acc.subProfiles.forEach((sub, sIdx) => {
                    let name = sub.subName ? sub.subName : acc.accountName;
                    if (name.toLowerCase().includes(q)) {
                        let avatar = sub.avatar ? sub.avatar : acc.avatar;
                        results.push({ aIdx, sIdx, name, avatar });
                    }
                });
            });

            if (results.length === 0) {
                dropdown.innerHTML = '<div class="p-3 text-xs text-purple-300 text-center font-bold">Ничего не найдено, ня~ 😿</div>';
                dropdown.classList.remove('hidden');
                return;
            }

            let html = '';
            results.forEach(res => {
                html += `
                    <div onclick="selectArtist(${res.aIdx}, ${res.sIdx})" class="flex items-center space-x-3 p-2.5 hover:bg-purple-900/80 cursor-pointer transition-all">
                        <div class="w-10 h-10 rounded-full border-2 border-yellow-400 overflow-hidden shrink-0 bg-white flex items-center justify-center">
                            <img src="user/ava/${res.avatar}" alt="" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-yellow-300 font-black text-xs">${res.name}</span>
                            <span class="text-[10px] text-purple-300">Художник / Профиль</span>
                        </div>
                    </div>
                `;
            });

            dropdown.innerHTML = html;
            dropdown.classList.remove('hidden');
        }

        function selectArtist(aIdx, sIdx) {
            currentAccountIdx = aIdx;
            currentSubProfileIdx = sIdx;
            document.getElementById('searchResultsDropdown').classList.add('hidden');
            document.getElementById('artistSearchInput').value = '';
            triggerAvatarAnimationAndSwitch();
        }

        document.addEventListener('click', (e) => {
            const searchContainer = document.getElementById('artistSearchInput').closest('div').parentNode;
            if (!searchContainer.contains(e.target)) {
                document.getElementById('searchResultsDropdown').classList.add('hidden');
            }
        });

        function buildInternalDatabase() {
            dbItems = [];
            KatyaGallery.forEach((acc, aIdx) => {
                acc.subProfiles.forEach((sub, sIdx) => {
                    let accName = sub.subName ? sub.subName : acc.accountName;
                    for (let mode in sub.modes) {
                        let numCounter = 1; // Нумерация для режима в рамках данного профиля
                        for (let dateRaw in sub.modes[mode]) {
                            let parts = dateRaw.split('/');
                            let dateObj = { raw: dateRaw, day: parts[0], month: parts[1], year: (parts[2].length===2?"20"+parts[2]:parts[2]) };
                            
                            sub.modes[mode][dateRaw].forEach(fileData => {
                                let isAnime = (mode === 'anime' || (typeof fileData === 'string' && (fileData.endsWith('.mp4') || fileData.includes('anime/'))));
                                let item = { aIdx, sIdx, authorName: accName, mode: isAnime ? 'anime' : mode, dateObj, type: mode === 'history' ? 'history' : (isAnime ? 'anime' : 'image') };
                                
                                let modeLabel = modeTitles[mode] || mode;

                                if (item.type === 'history') {
                                    item.title = `Запись Истории`;
                                    item.text = fileData.title;
                                    item.id = `hist_${accName}_${dateRaw}_${item.text}`;
                                } else if (item.type === 'anime') {
                                    item.title = `АНИМАЦИЯ ${accName} №${numCounter}`;
                                    item.image = fileData.startsWith('anime/') ? `user/art/${fileData}` : `user/art/anime/${fileData}`;
                                    item.id = `anim_${accName}_${numCounter}_${dateRaw}`;
                                    numCounter++;
                                } else {
                                    item.title = `РАБОТА ${modeLabel} ${accName} №${numCounter}`; 
                                    item.image = `user/art/${fileData}`;
                                    item.id = `img_${accName}_${mode}_${numCounter}`;
                                    numCounter++;
                                }
                                dbItems.push(item);
                            });
                        }
                    }
                });
            });

            if (typeof autoAnimeMappings !== 'undefined' && autoAnimeMappings.length > 0) {
                autoAnimeMappings.forEach((map, mIdx) => {
                    let parts = map.date.split('/');
                    let dateObj = { raw: map.date, day: parts[0], month: parts[1], year: (parts[2].length===2?"20"+parts[2]:parts[2]) };
                    map.authors.forEach(authorName => {
                        KatyaGallery.forEach((acc, aIdx) => {
                            if (acc.accountName.toLowerCase() === authorName.toLowerCase()) {
                                acc.subProfiles.forEach((sub, sIdx) => {
                                    if (sub.subDir === "") {
                                        let accName = sub.subName ? sub.subName : acc.accountName;
                                        let item = {
                                            aIdx, sIdx,
                                            authorName: accName,
                                            mode: 'anime',
                                            dateObj,
                                            type: 'anime',
                                            title: `АНИМАЦИЯ ${accName} №${mIdx + 1}`,
                                            image: map.file,
                                            id: `autoanim_${accName}_${mIdx+1}_${map.date}`
                                        };
                                        dbItems.push(item);
                                    }
                                });
                            }
                        });
                    });
                });
            }
        }

        function initPage() {
            buildInternalDatabase();
            if(KatyaGallery.length > 0) switchAccount(0);
        }

        function nextMainAccount() {
            currentAccountIdx = (currentAccountIdx + 1) % KatyaGallery.length;
            switchAccount(currentAccountIdx);
        }

        function prevMainAccount() {
            currentAccountIdx = (currentAccountIdx - 1 + KatyaGallery.length) % KatyaGallery.length;
            switchAccount(currentAccountIdx);
        }

        function nextSubProfile() {
            const subsLength = KatyaGallery[currentAccountIdx].subProfiles.length;
            if (subsLength > 1) {
                currentSubProfileIdx = (currentSubProfileIdx + 1) % subsLength;
                triggerAvatarAnimationAndSwitch();
            }
        }

        function prevSubProfile() {
            const subsLength = KatyaGallery[currentAccountIdx].subProfiles.length;
            if (subsLength > 1) {
                currentSubProfileIdx = (currentSubProfileIdx - 1 + subsLength) % subsLength;
                triggerAvatarAnimationAndSwitch();
            }
        }

        function triggerAvatarAnimationAndSwitch() {
            const avatarImg = document.getElementById('mainAvatarImg');
            avatarImg.classList.remove('animate-avatar');
            void avatarImg.offsetWidth; 
            avatarImg.classList.add('animate-avatar');
            switchSubProfile(currentSubProfileIdx);
        }

        function typeWriterEffect(text) {
            const el = document.getElementById('subAccountName');
            el.innerHTML = '';
            clearTimeout(typingTimer);
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    typingTimer = setTimeout(type, 40);
                }
            }
            type();
        }

        function switchAccount(idx) {
            currentAccountIdx = parseInt(idx);
            currentSubProfileIdx = 0; 
            triggerAvatarAnimationAndSwitch(); 
        }

        function switchSubProfile(idx) {
            currentSubProfileIdx = parseInt(idx);
            selectedFilterDate = null;
            
            const acc = KatyaGallery[currentAccountIdx];
            const sub = acc.subProfiles[currentSubProfileIdx];
            
            const avatarToUse = sub.avatar ? sub.avatar : acc.avatar;
            document.getElementById('mainAvatarImg').src = `user/ava/${avatarToUse}`;
            
            let mainName = sub.subName ? sub.subName : acc.accountName;
            document.getElementById('mainAccountName').textContent = mainName;
            
            let desc = sub.subDir === "" ? "ОСНОВНОЙ ПРОФИЛЬ" : "СУБ.ПРОФИЛЬ";
            typeWriterEffect(desc);

            renderGrid();
        }

        function switchMode(mode) {
            currentMode = mode; selectedFilterDate = null;
            document.getElementById('page-title').textContent = modeTitles[mode] || 'РАБОТЫ';
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = btn.getAttribute('data-mode') === mode 
                    ? "mode-btn px-4 py-1.5 rounded-xl text-xs font-black border-2 border-purple-950 shadow transition-all bg-yellow-400 text-purple-950"
                    : "mode-btn px-4 py-1.5 rounded-xl text-xs font-black border-2 border-purple-950 shadow transition-all bg-purple-800 text-white hover:bg-purple-700";
            });
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('artworks-grid');
            container.innerHTML = '';

            let items = dbItems.filter(i => i.aIdx === currentAccountIdx && i.sIdx === currentSubProfileIdx);
            if (currentMode !== 'all') items = items.filter(i => i.mode === currentMode);
            if (selectedFilterDate) items = items.filter(i => i.dateObj.raw === selectedFilterDate);

            currentDisplayedItems = items;

            if (items.length === 0) {
                container.innerHTML = '<div class="text-center text-purple-300 py-10 font-bold">В этой папке пока пусто. Ня~ ✨</div>';
                return;
            }

            if (currentMode === 'all') {
                let groups = {};
                items.forEach(item => {
                    let k = item.dateObj.raw;
                    if(!groups[k]) groups[k] = { d: item.dateObj, arr: [] };
                    groups[k].arr.push(item);
                });
                
                Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(key => {
                    let g = groups[key];
                    let dateLabel = `${g.d.day} ${monthNames[g.d.month]} ${g.d.year} г.`;
                    let blockDiv = document.createElement('div');
                    blockDiv.className = "mb-6";
                    blockDiv.innerHTML = `<div class="flex items-center space-x-4 mb-4"><span class="bg-purple-900 text-yellow-300 px-4 py-1.5 rounded-xl font-black text-sm border-2 border-purple-700 shadow uppercase">📅 ${dateLabel}</span><div class="flex-grow border-b-2 border-dashed border-purple-500/50"></div></div>`;
                    let grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6";
                    g.arr.forEach(it => grid.appendChild(createCardElement(it)));
                    blockDiv.appendChild(grid); container.appendChild(blockDiv);
                });
            } else {
                let grid = document.createElement('div');
                grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6";
                items.forEach(it => grid.appendChild(createCardElement(it)));
                container.appendChild(grid);
            }
        }

        function createCardElement(item) {
            const card = document.createElement('div');
            const dateStr = `${item.dateObj.day} ${monthNames[item.dateObj.month]} ${item.dateObj.year}`;
            const idx = currentDisplayedItems.indexOf(item);

            if (item.type === 'history') {
                card.className = "bg-white rounded-2xl shadow-xl overflow-hidden border-4 border-purple-950 flex flex-col justify-between p-4 transform hover:-translate-y-1 transition-all duration-300 relative group cursor-pointer aspect-square";
                card.innerHTML = `<div class="w-full h-full overflow-y-auto text-purple-950 font-bold text-sm p-2" onclick="openFullSizeModal(${idx})"><p>${item.text}</p></div><div class="mt-2 text-[10px] text-gray-500 flex justify-between items-center"><span class="bg-purple-200 text-purple-950 px-2 py-0.5 rounded font-bold">${dateStr}</span></div>`;
            } else if (item.type === 'anime') {
                card.className = "bg-white/95 rounded-2xl shadow-xl overflow-hidden border-4 border-purple-950 flex flex-col justify-between transform hover:-translate-y-1 transition-all relative group cursor-pointer aspect-square";
                card.innerHTML = `
                    <div class="flex-grow overflow-hidden bg-black relative pointer-events-none" onclick="openFullSizeModal(${idx})">
                        <video src="${item.image}" autoplay loop muted playsinline class="w-full h-full object-cover group-hover:scale-105 transition-transform"></video>
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white font-bold text-sm pointer-events-auto">Просмотр 🔍</div>
                    </div>
                    <div class="p-3 bg-purple-900 text-white font-bold text-xs truncate flex items-center justify-between px-4">
                        <span class="truncate" title="${item.title}">${item.title}</span>
                        <span class="text-[10px] bg-pink-600 px-2 py-0.5 rounded font-bold shrink-0 ml-2">${dateStr}</span>
                    </div>`;
            } else {
                card.className = "bg-white/95 rounded-2xl shadow-xl overflow-hidden border-4 border-purple-950 flex flex-col justify-between transform hover:-translate-y-1 transition-all relative group cursor-pointer aspect-square";
                card.innerHTML = `<div class="flex-grow overflow-hidden bg-gray-200 relative" onclick="openFullSizeModal(${idx})"><img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://placehold.co/300x200/cccccc/333333?text=Картинка+не+найдена'"><div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white font-bold text-sm">Просмотр 🔍</div></div><div class="p-3 bg-purple-900 text-white font-bold text-xs truncate flex items-center justify-between px-4"><span class="truncate" title="${item.title}">${item.title}</span><span class="text-[10px] bg-pink-600 px-2 py-0.5 rounded font-bold shrink-0 ml-2">${dateStr}</span></div>`;
            }
            return card;
        }

        // =======================================================================
        // 🎀 ЛОГИКА ПРОСМОТРА И ЛИСТАНИЯ В МОДАЛЬНОМ ОКНЕ 🎀
        // =======================================================================
        function openFullSizeModal(idx) {
            currentModalIdx = idx;
            renderModalContent();
            document.getElementById('fullsize-modal').classList.remove('hidden');
        }

        function renderModalContent() {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            document.getElementById('fullsize-title').textContent = item.title;
            document.getElementById('fullsize-year').textContent = `📅 Дата: ${item.dateObj.day} ${monthNames[item.dateObj.month]} ${item.dateObj.year} г.`;
            
            // Обновляем количество кубков автора
            const authorTrophies = getAuthorTrophies(item.authorName);
            document.getElementById('author-trophy-count').textContent = authorTrophies;

            const container = document.getElementById('fullsize-content-container');
            const bgAudio = document.getElementById('bgMusic');
            
            // Музыка останавливается ТОЛЬКО если открывается видео (anime)
            if (item.type === 'anime') {
                if (bgAudio && !bgAudio.paused) {
                    wasMusicPlayingBeforeVideo = true;
                    bgAudio.pause();
                    document.getElementById('musicText').textContent = 'Музыка: Выкл';
                    document.getElementById('musicIcon').className = 'fas fa-play';
                }
            } else {
                // Если сменили видео на обычную картинку, возвращаем музыку
                if (bgAudio && wasMusicPlayingBeforeVideo && bgAudio.paused) {
                    bgAudio.play().then(() => {
                        document.getElementById('musicText').textContent = 'Музыка: Вкл';
                        document.getElementById('musicIcon').className = 'fas fa-pause';
                    }).catch(e => console.log(e));
                }
            }

            if (item.type === 'history') {
                container.innerHTML = `
                    <div class="bg-amber-50 text-purple-950 p-6 md:p-8 rounded-2xl w-full max-h-[50vh] overflow-y-auto shadow-2xl relative border-4 border-amber-200" style="background-image: repeating-linear-gradient(transparent, transparent 35px, #e5e7eb 35px, #e5e7eb 36px); line-height: 36px;">
                        <div class="flex items-start space-x-4 pt-1">
                            <div class="text-3xl mt-1">✒️</div>
                            <div class="flex-grow">
                                <p class="text-2xl md:text-3xl font-bold text-purple-950 font-handwritten tracking-wide">
                                    ${item.text}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (item.type === 'anime') {
                container.innerHTML = `<video id="modalVideo" src="${item.image}" controls autoplay class="max-w-full max-h-[50vh] w-auto h-auto object-contain rounded-xl shadow-2xl"></video>`;
                setTimeout(() => {
                    const mVideo = document.getElementById('modalVideo');
                    if(mVideo) {
                        mVideo.volume = parseFloat(document.getElementById('volumeControl').value);
                    }
                }, 50);
            } else {
                container.innerHTML = `<img src="${item.image}" alt="Полный размер" class="max-w-full max-h-[50vh] w-auto h-auto object-contain rounded-xl shadow-2xl">`;
            }

            // Обновляем состояние Стрелочек листания и Реакций
            updateModalNavigationState();
            updateReactionButtonsState();
        }

        // 🎀 ФУНКЦИИ ПЕРЕХОДА НА ПЕРВУЮ И ПОСЛЕДНЮЮ РАБОТУ 🎀
function goToFirstModalItem() {
    if (currentModalIdx > 0) {
        currentModalIdx = 0;
        renderModalContent();
    }
}

function goToLastModalItem() {
    if (currentModalIdx < currentDisplayedItems.length - 1) {
        currentModalIdx = currentDisplayedItems.length - 1;
        renderModalContent();
    }
}

// Обновленная функция управления состоянием кнопок листания (включая << и >>)
function updateModalNavigationState() {
    const firstBtn = document.getElementById('modal-first-btn');
    const prevBtn = document.getElementById('modal-prev-btn');
    const nextBtn = document.getElementById('modal-next-btn');
    const lastBtn = document.getElementById('modal-last-btn');
    const counter = document.getElementById('modal-counter-badge');

    counter.textContent = `${currentModalIdx + 1} / ${currentDisplayedItems.length}`;

    // Состояние для Кнопки "На первую работу" (<<)
    if (currentModalIdx === 0) {
        firstBtn.disabled = true;
        firstBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow bg-gray-600 text-gray-400 cursor-not-allowed opacity-50 border-2 border-gray-700";
    } else {
        firstBtn.disabled = false;
        firstBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow-lg bg-purple-800 hover:bg-purple-700 text-yellow-300 border-2 border-yellow-400 hover:scale-110 active:scale-95 cursor-pointer transition-all";
    }

    // Состояние для Стрелочки Влево (<)
    if (currentModalIdx === 0) {
        prevBtn.disabled = true;
        prevBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow bg-gray-600 text-gray-400 cursor-not-allowed opacity-50 border-2 border-gray-700";
    } else {
        prevBtn.disabled = false;
        prevBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow-lg bg-purple-800 hover:bg-purple-700 text-yellow-300 border-2 border-yellow-400 hover:scale-110 active:scale-95 cursor-pointer transition-all";
    }

    // Состояние для Стрелочки Вправо (>)
    if (currentModalIdx === currentDisplayedItems.length - 1) {
        nextBtn.disabled = true;
        nextBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow bg-gray-600 text-gray-400 cursor-not-allowed opacity-50 border-2 border-gray-700";
    } else {
        nextBtn.disabled = false;
        nextBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow-lg bg-purple-800 hover:bg-purple-700 text-yellow-300 border-2 border-yellow-400 hover:scale-110 active:scale-95 cursor-pointer transition-all";
    }

    // Состояние для Кнопки "На последнюю работу" (>>)
    if (currentModalIdx === currentDisplayedItems.length - 1) {
        lastBtn.disabled = true;
        lastBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow bg-gray-600 text-gray-400 cursor-not-allowed opacity-50 border-2 border-gray-700";
    } else {
        lastBtn.disabled = false;
        lastBtn.className = "w-11 h-11 rounded-2xl flex items-center justify-center font-bold text-lg shadow-lg bg-purple-800 hover:bg-purple-700 text-yellow-300 border-2 border-yellow-400 hover:scale-110 active:scale-95 cursor-pointer transition-all";
    }
}

        function prevModalItem() {
            if (currentModalIdx > 0) {
                currentModalIdx--;
                renderModalContent();
            }
        }

        function nextModalItem() {
            if (currentModalIdx < currentDisplayedItems.length - 1) {
                currentModalIdx++;
                renderModalContent();
            }
        }

        // =======================================================================
        // 🎀 КНОПКИ РЕАКЦИЙ (ЛАЙК, ДИЗЛАЙК, КУБОК) 🎀
        // =======================================================================
        function updateReactionButtonsState() {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const db = getSavedReactions();
            const rec = db[item.id] || { like: false, dislike: false, trophy: false };

            const iconLike = document.getElementById('icon-like');
            const btnDislike = document.getElementById('btn-dislike');
            const btnTrophy = document.getElementById('btn-trophy');

           // 1. Лайк
            if (rec.like) {
                iconLike.className = "fas fa-heart text-pink-500 scale-110";
            } else {
                iconLike.className = "far fa-heart text-pink-400";
            }

            // 2. Дизлайк
            if (rec.dislike) {
                btnDislike.className = "text-2xl hover:scale-125 active:scale-90 transition-transform relative focus:outline-none opacity-100 scale-110";
            } else {
                btnDislike.className = "text-2xl hover:scale-125 active:scale-90 transition-transform relative focus:outline-none opacity-40 grayscale hover:grayscale-0 hover:opacity-100";
            }

            // 3. Кубок
            if (rec.trophy) {
                btnTrophy.className = "text-2xl hover:scale-125 active:scale-90 transition-transform relative focus:outline-none scale-125 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]";
            } else {
                btnTrophy.className = "text-2xl hover:scale-125 active:scale-90 transition-transform relative focus:outline-none opacity-60 hover:opacity-100";
            }
        }

        function toggleLike(e) {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const db = getSavedReactions();
            if (!db[item.id]) db[item.id] = { author: item.authorName };

            db[item.id].like = !db[item.id].like;
            if (db[item.id].like) {
                db[item.id].dislike = false; // снимаем дизлайк при лайке
                createParticles(e.clientX, e.clientY, ['💖', '❤️', '💕', '✨', '🌸']);
            }
            saveReactions(db);
            updateReactionButtonsState();
        }

        function toggleDislike(e) {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const db = getSavedReactions();
            if (!db[item.id]) db[item.id] = { author: item.authorName };

            db[item.id].dislike = !db[item.id].dislike;
            if (db[item.id].dislike) {
                db[item.id].like = false; // снимаем лайк при дизлайке
            }
            saveReactions(db);
            updateReactionButtonsState();
        }

        function rewardTrophy(e) {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const db = getSavedReactions();
            if (!db[item.id]) db[item.id] = { author: item.authorName };

            db[item.id].trophy = !db[item.id].trophy;
            db[item.id].author = item.authorName; // сохраняем имя автора

            if (db[item.id].trophy) {
                createParticles(e.clientX, e.clientY, ['🏆', '✨', '⭐', '🎉', '🌟']);
            }

            saveReactions(db);
            updateReactionButtonsState();
            
            // Обновляем плашку кубков автора
            const count = getAuthorTrophies(item.authorName);
            document.getElementById('author-trophy-count').textContent = count;
        }

        function closeFullSizeModal() { 
            const container = document.getElementById('fullsize-content-container');
            const video = container.querySelector('video');
            if (video) {
                video.pause();
                video.currentTime = 0;
            }
            container.innerHTML = '';
            document.getElementById('fullsize-modal').classList.add('hidden'); 

            // Возобновляем музыку только если она была остановлена перед просмотром видео
            const bgAudio = document.getElementById('bgMusic');
            if (bgAudio && wasMusicPlayingBeforeVideo) {
                bgAudio.play().then(() => {
                    document.getElementById('musicText').textContent = 'Музыка: Вкл';
                    document.getElementById('musicIcon').className = 'fas fa-pause';
                }).catch(e => console.log("Не удалось возобновить музыку:", e));
            }
        }

        function openFilterModal() {
            let datesSet = new Set();
            let items = dbItems.filter(i => i.aIdx === currentAccountIdx && i.sIdx === currentSubProfileIdx);
            if (currentMode !== 'all') items = items.filter(i => i.mode === currentMode);
            items.forEach(it => datesSet.add(it.dateObj.raw));

            const listContainer = document.getElementById('filter-years-list');
            listContainer.innerHTML = '';
            if (datesSet.size === 0) {
                listContainer.innerHTML = '<p class="text-xs text-purple-300 text-center py-2">Нет дат</p>';
            } else {
                Array.from(datesSet).sort().reverse().forEach(dateRaw => {
                    let p = dateRaw.split('/'); let dLbl = `${p[0]} ${monthNames[p[1]]} 20${p[2]} г.`;
                    const isSel = selectedFilterDate === dateRaw;
                    const btn = document.createElement('button');
                    btn.className = `w-full py-2.5 px-4 rounded-xl font-bold text-sm cursor-pointer flex justify-between border-2 ${isSel ? 'bg-yellow-400 text-purple-950 border-white' : 'bg-purple-900 text-white border-purple-700'}`;
                    btn.innerHTML = `<span>📅 ${dLbl}</span> ${isSel ? '<span class="text-xs">✓</span>' : ''}`;
                    btn.onclick = () => { selectedFilterDate = dateRaw; renderGrid(); closeFilterModal(); };
                    listContainer.appendChild(btn);
                });
            }
            document.getElementById('filter-modal').classList.remove('hidden');
        }
        function closeFilterModal() { document.getElementById('filter-modal').classList.add('hidden'); }
        function applyYearFilter(val) { selectedFilterDate = val; renderGrid(); closeFilterModal(); }

        window.onload = initPage;
    </script>
</body>
</html>

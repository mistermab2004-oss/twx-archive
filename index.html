            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;

            border-left: 2px solid #808080;
            border-right: 2px solid #dfdfdf;
            border-bottom: 2px solid #dfdfdf;

            color: #707070;
            cursor: not-allowed;
            pointer-events: none;

                btnAbout.onmouseover = function() { this.src='user/system/arca 18.png'; }
                btnAbout.onmouseout = function() { this.src='user/system/arca 17.png'; }
                btnAbout.parentElement.href = "zlo_about.html";

                btnStreams.src = "user/system/arca 19.png";
                btnStreams.onmouseover = function() { this.src='user/system/arca 20.png'; }
                btnStreams.onmouseout = function() { this.src='user/system/arca 19.png'; }
                btnStreams.parentElement.href = "stream_zlo.html";

                imgFav.src = "user/system/arca 11.png";
                imgFav.onmouseover = function() { this.src='user/system/arca 12.png'; }
                imgFav.onmouseout = function() { this.src='user/system/arca 11.png'; }

                imgAll.src = "user/system/arca 13.png";
                imgAll.onmouseover = function() { this.src='user/system/arca 14.png'; }
                imgAll.onmouseout = function() { this.src='user/system/arca 13.png'; }
                linkAll.href = "zlo_all_works.html";

                switchMusicTo('zlo');

                const randomVillainQuote = VillainQuotes[Math.floor(Math.random() * VillainQuotes.length)];
                document.getElementById('daily-quote-text').textContent = `«${randomVillainQuote}»`;

            } else {
                checkHolidayAndSetQuote();
                siteTitle.textContent = "TWX АРХИВ - Главная";
                siteHeaderTitle.textContent = "TWX АРХИВ";
                siteFavicon.href = "user/system/icon index.png";
                mainLogoImg.src = "user/ava/logo.png";
                mainCenterLogo.src = "user/ava/logo.png";
                widgetTitle.textContent = "Художники";
                quoteHeader.textContent = "💬 Фраза дня";

                btnArtick.src = "user/system/arca 9.png";
                btnArtick.onmouseover = function() { this.src='user/system/arca 10.png'; }
                btnArtick.onmouseout = function() { this.src='user/system/arca 9.png'; }
                btnArtick.parentElement.href = "artick.html";

                btnAbout.src = "user/system/arca 5.png";
                btnAbout.onmouseover = function() { this.src='user/system/arca 6.png'; }
                btnAbout.onmouseout = function() { this.src='user/system/arca 5.png'; }
                btnAbout.parentElement.href = "about.html";

                btnStreams.src = "user/system/arca 7.png";
                btnStreams.onmouseover = function() { this.src='user/system/arca 8.png'; }
                btnStreams.onmouseout = function() { this.src='user/system/arca 7.png'; }
                btnStreams.parentElement.href = "streams.html";

                imgFav.src = "user/system/arca 1.png";
                imgFav.onmouseover = function() { this.src='user/system/arca 2.png'; }
                imgFav.onmouseout = function() { this.src='user/system/arca 1.png'; }

                imgAll.src = "user/system/arca 3.png";
                imgAll.onmouseover = function() { this.src='user/system/arca 4.png'; }
                imgAll.onmouseout = function() { this.src='user/system/arca 3.png'; }
                linkAll.href = "gartic_phone_all_works.html";

                switchMusicTo('main');
            }
            renderWidget();
        }

        function handleFavWorksClick(event) {
            if (isZloMode) {
                event.preventDefault();
                document.getElementById('zlo-fav-modal').classList.remove('hidden');
                document.getElementById('zlo-fav-result').classList.add('hidden');
            }
        }

        function zloFavChoice(choice) {
            if (choice === 'yes') {
                const res = document.getElementById('zlo-fav-result');
                res.classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('zlo-fav-modal').classList.add('hidden');
                }, 2000);
            } else {
                document.getElementById('zlo-fav-modal').classList.add('hidden');
            }
        }

        function checkZloExitEasterEgg(text) {
            if (text.toLowerCase().includes("а ведь все же художник")) {
                document.getElementById('zlo-exit-modal').classList.remove('hidden');
            }
        }

        function zloExitChoice(choice) {
            if (choice === 'leave') {
                toggleZloMode();
                document.getElementById('zlo-exit-modal').classList.add('hidden');
            } else {
                document.getElementById('zlo-exit-modal').classList.add('hidden');
            }
        }

        function filterEntities() {
            searchQuery = document.getElementById('artist-search').value.trim().toLowerCase();
            currentPage = 0;
            renderWidget();
            
            if (isZloMode) {
                checkZloExitEasterEgg(searchQuery);
            }
        }

        function getFilteredEntities() {
            const dataSource = isZloMode ? VillainsData : ArtistsData;
            return dataSource.filter(item => {
                if (!searchQuery) return true;
                const name = item.name.toLowerCase();
                return name.startsWith(searchQuery) || name.includes(searchQuery);
            });
        }

        function renderWidget() {
            const grid = document.getElementById('widget-grid');
            grid.innerHTML = '';
            
            const filtered = getFilteredEntities();
            const start = currentPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filtered.slice(start, end);

            if (pageItems.length === 0) {
                const emptyText = isZloMode ? "Злодеи не найдены!" : "Художники не найдены, милый!";
                grid.innerHTML = `<div class="col-span-2 sm:col-span-3 text-center text-purple-900 font-bold py-8">${emptyText}</div>`;
                return;
            }

            pageItems.forEach((item, pageIdx) => {
                const actualIndex = start + pageIdx;
                const elem = document.createElement('div');
                elem.className = "flex flex-col items-center cursor-pointer group";
                elem.onclick = () => {
                    openModalByIndex(actualIndex);
                    if (!isZloMode) {
                        checkZloEasterEgg(item.name);
                    }
                };
                elem.innerHTML = `
                    <div class="w-16 h-16 rounded-xl overflow-hidden border-2 border-purple-300 shadow-md group-hover:border-pink-500 group-hover:scale-110 transition-all">
                        <img src="${item.avatar}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/511252/ffffff?text=Ava'">
                    </div>
                    <span class="text-xs font-bold text-purple-900 mt-1 text-center leading-tight line-clamp-2">${item.name}</span>
                `;
                grid.appendChild(elem);
            });
        }

        function nextPage() {
            const filtered = getFilteredEntities();
            if ((currentPage + 1) * ITEMS_PER_PAGE < filtered.length) {
                currentPage++;
                renderWidget();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderWidget();
            }
        }

        let currentEntityData = null;
        let currentTab = 'desc';

        function openModal(id) {
            const dataSource = isZloMode ? VillainsData : ArtistsData;
            const idx = dataSource.findIndex(a => a.id === id);
            if (idx !== -1) {
                openModalByIndex(dataSource.indexOf(dataSource[idx]));
            }
        }

        function openModalByIndex(index) {
            const filtered = getFilteredEntities();
            if (index < 0 || index >= filtered.length) return;

            currentEntityIndex = index;
            currentEntityData = filtered[currentEntityIndex];

            currentSkinIndex = -1;
            isSkinMenuExpanded = false;
            
            document.getElementById('modal-debut').textContent = (isZloMode ? "ИСТОЧНИК: " : "DEBUT: ") + currentEntityData.debut;
            
            updateModalView();

            const modal = document.getElementById('retro-modal');
            const windowAnim = document.getElementById('retro-window-anim');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                windowAnim.classList.remove('scale-95');
                windowAnim.classList.add('scale-100');
            }, 10);

            if (!isZloMode) switchMusicTo('pro');
        }

        function modalPrevArtist() {
            if (currentEntityIndex > 0) {
                openModalByIndex(currentEntityIndex - 1);
            }
        }

        function modalNextArtist() {
            const filtered = getFilteredEntities();
            if (currentEntityIndex < filtered.length - 1) {
                openModalByIndex(currentEntityIndex + 1);
            }
        }

        function closeModal() {
            const modal = document.getElementById('retro-modal');
            const windowAnim = document.getElementById('retro-window-anim');
            
            modal.classList.add('opacity-0');
            windowAnim.classList.remove('scale-100');
            windowAnim.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);

            if (!isZloMode) switchMusicTo('main');
        }

        function selectSkin(index) {
            currentSkinIndex = index;
            updateModalView();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            const btnDesc = document.getElementById('tab-desc');
            const btnNotes = document.getElementById('tab-notes');
            if (tabName === 'desc') {
                btnDesc.classList.add('active-tab');
                btnNotes.classList.remove('active-tab');
            } else {
                btnNotes.classList.add('active-tab');
                btnDesc.classList.remove('active-tab');
            }
            
            renderModalText();
        }

        function expandSkinMenu() {
            if (!currentEntityData || !currentEntityData.originalscin) return;
            isSkinMenuExpanded = true;
            renderSkinButtons();
        }

        function collapseSkinMenu() {
            if (!currentEntityData || !currentEntityData.originalscin) return;
            isSkinMenuExpanded = false;
            renderSkinButtons();
        }

        function updateModalView() {
            if (!currentEntityData) return;

            if (currentSkinIndex === -1) {
                document.getElementById('modal-title-name').textContent = currentEntityData.name;
                document.getElementById('modal-character-img').src = currentEntityData.fullImage;
            } else {
                const skin = currentEntityData.skins[currentSkinIndex];
                document.getElementById('modal-title-name').textContent = skin.name;
  
                const skinImg = skin.fullImage || skin.image || skin.toop || currentEntityData.fullImage;
                document.getElementById('modal-character-img').src = skinImg;
            }

            renderModalText();
            renderSkinButtons();
            updatePaginationButtonsState();
        }

        function updatePaginationButtonsState() {
            const filtered = getFilteredEntities();
            const prevBtn = document.getElementById('modal-prev-artist');
            const nextBtn = document.getElementById('modal-next-artist');

            if (!prevBtn || !nextBtn) return;

            if (currentEntityIndex <= 0) {
                prevBtn.classList.add('retro-disabled');
            } else {
                prevBtn.classList.remove('retro-disabled');
            }

            if (currentEntityIndex >= filtered.length - 1) {
                nextBtn.classList.add('retro-disabled');
            } else {
                nextBtn.classList.remove('retro-disabled');
            }
        }

        function renderModalText() {
            const contentBox = document.getElementById('modal-text-content');
            if (!contentBox || !currentEntityData) return;

            if (currentTab === 'desc') {
                let descText = currentEntityData.desc;
                if (currentSkinIndex !== -1 && currentEntityData.skins && currentEntityData.skins[currentSkinIndex]) {
                    descText = currentEntityData.skins[currentSkinIndex].desc;
                }
                contentBox.innerHTML = `<div>${descText}</div>`;
            } else {
                let notesText = currentEntityData.notes;
                if (currentSkinIndex !== -1 && currentEntityData.skins && currentEntityData.skins[currentSkinIndex] && currentEntityData.skins[currentSkinIndex].notes) {
                    notesText = currentEntityData.skins[currentSkinIndex].notes;
                }
                contentBox.innerHTML = `<div>${notesText}</div>`;
            }
        }

        function renderSkinButtons() {
            const container = document.getElementById('skin-buttons-container');
            const block = document.getElementById('skin-buttons-block');
            const arrowsContainer = document.getElementById('retro-arrows-container');
            
            if (!container || !block || !arrowsContainer) return;

            if (!isZloMode && currentEntityData && currentEntityData.originalscin) {
                container.classList.remove('hidden');
                arrowsContainer.classList.remove('hidden');
                
                block.innerHTML = '';

                const imgSizeClass = isSkinMenuExpanded ? "w-16 h-16 sm:w-20 sm:h-20" : "w-10 h-10 sm:w-12 sm:h-12";
                const paddingClass = isSkinMenuExpanded ? "p-2 sm:p-3" : "p-1";

                const origIcon = currentEntityData.originalscin;
                const isOrigActive = (currentSkinIndex === -1);
                
                const origBtn = document.createElement('button');
                origBtn.className = `retro-btn ${isOrigActive ? 'active-tab border-2 border-purple-600' : ''} ${paddingClass} flex flex-col items-center justify-center cursor-pointer hover:scale-105 transition-transform flex-shrink-0`;
                origBtn.title = "Оригинал: " + currentEntityData.name;
                origBtn.onclick = () => selectSkin(-1);
                origBtn.innerHTML = `
                    <img src="${origIcon}" class="${imgSizeClass} object-cover rounded shadow">
                    ${isSkinMenuExpanded ? '<span class="text-[9px] sm:text-[10px] font-bold text-black mt-1">Оригинал</span>' : ''}
                `;
                block.appendChild(origBtn);

                if (currentEntityData.skins && currentEntityData.skins.length > 0) {
                    currentEntityData.skins.forEach((skin, idx) => {
                        const isSkinActive = (currentSkinIndex === idx);
                        const skinBtn = document.createElement('button');
                        skinBtn.className = `retro-btn ${isSkinActive ? 'active-tab border-2 border-purple-600' : ''} ${paddingClass} flex flex-col items-center justify-center cursor-pointer hover:scale-105 transition-transform flex-shrink-0`;
                        skinBtn.title = "Скин: " + skin.name;
                        skinBtn.onclick = () => selectSkin(idx);
                        skinBtn.innerHTML = `
                            <img src="${skin.avatar}" class="${imgSizeClass} object-cover rounded shadow">
                            ${isSkinMenuExpanded ? `<span class="text-[9px] sm:text-[10px] font-bold text-black mt-1 truncate max-w-[80px]">${skin.name}</span>` : ''}
                        `;
                        block.appendChild(skinBtn);
                    });
                }
            } else {
                container.classList.add('hidden');
                arrowsContainer.classList.add('hidden');
            }
        }

        function checkHolidayAndSetQuote() {
            if (isZloMode) return;

            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            let holidayQuote = null;
            let bgImage = 'user/system/yu.png';
            let titleDecoration = '';

            if ((month === 12 && day >= 21) || (month === 1 && day === 1)) {
                holidayQuote = "С наступающим Новым годом, милый! Пусть все баги останутся в прошлом, а в новом году нас ждет чистый холст и море вдохновения, мяу! 🎄✨";
                bgImage = 'user/system/yu_newyear.png';
                titleDecoration = '❄️ ';
            } else if (month === 10) {
                holidayQuote = "Наступил жуткий месяц Хэллоуина! Призраки прошлого и мистические истории шепчутся из каждого угла, бойся своих скетчбуков! 🎃👻";
                bgImage = 'user/system/yu_halloween.png';
                titleDecoration = '🦇 ';
            } else if (month === 5 && day === 21) {
                holidayQuote = "С днем рождения нашего гениального создателя Маба! Сегодня весь сайт празднует этот великий день, ура! 🎉🎂";
                bgImage = 'user/system/yu_creator_bd.png';
                titleDecoration = '👑 ';
            } else if (month === 7 && day === 13) {
                holidayQuote = "С днем рождения легендарного стримера Хантера! Эпичные бомбежки, ламповые стримы и море позитива сегодня льются рекой! 🎙️🎮";
                bgImage = 'user/system/yu_hunter_bd.png';
                titleDecoration = '⭐ ';
            } else if (month === 3 && day === 8) {
                holidayQuote = "С Международным женским днём! Пусть цветы распускаются, улыбки сияют, а все арты рисуются с первого раза, мяу! 🌷💖";
                bgImage = 'user/system/yu_march8.png';
                titleDecoration = '🌷 ';
            } else if (month === 4 && day === 1) {
                holidayQuote = "Никому не верь сегодня! День шуток, розыгрышей и полного творческого безумия настал, мяу! 🤡✨";
                bgImage = 'user/system/yu_april1.png';
                titleDecoration = '🃏 ';
            } else if (month === 4 && day === 12) {
                holidayQuote = "Поехали! С Днем космонавтики! Наши творческие ракеты улетают далеко за пределы галактики, к новым мирам и артам! 🚀🌌";
                bgImage = 'user/system/yu_space.png';
                titleDecoration = '🚀 ';
            } else if (month === 5 && day === 9) {
                holidayQuote = "С Днем Победы! Вечная память героям и мирного неба над головой! 🎖️🕊️";
                bgImage = 'user/system/yu_may9.png';
                titleDecoration = '🎖️ ';
            } else if (month === 8 && day === 20) {
                holidayQuote = "Всемирный день лени! Сегодня официально разрешено ничего не делать, завернуться в плед и лениво потягиваться, как котик 🦥💤";
                bgImage = 'user/system/yu_sloth.png';
                titleDecoration = '🦥 ';
            } else if (month === 9 && day === 1) {
                holidayQuote = "С Днем знаний! 1 сентября снова зовет за парты, но наши арты и игры всегда с нами! 📚🎒";
                bgImage = 'user/system/yu_sept1.png';
                titleDecoration = '🎒 ';
            } else if (month === 10 && day === 5) {
                holidayQuote = "С Днем учителя! Спасибо всем наставникам за мудрость, терпение и ценные уроки жизни! 🍎📖";
                bgImage = 'user/system/yu_teacher.png';
                titleDecoration = '🍎 ';
            }

            document.body.style.backgroundImage = `url('${bgImage}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';

            const quoteElem = document.getElementById('daily-quote-text');
            if (holidayQuote) {
                quoteElem.textContent = `«${holidayQuote}»`;
            } else {
                const dayOfMonth = new Date().getDate();
                const quoteIndex = (dayOfMonth - 1) % DailyQuotes.length;
                quoteElem.textContent = `«${DailyQuotes[quoteIndex]}»`;
            }

            if (titleDecoration) {
                const titleSpan = document.getElementById('site-header-title');
                if (titleSpan) {
                    titleSpan.textContent = titleDecoration + "TWX АРХИВ " + titleDecoration;
                }
            }
        }

        const audioMain = document.getElementById('music-main');
        const audioPro = document.getElementById('music-pro');
        const audioZlo = document.getElementById('music-zlo');
        const volumeSlider = document.getElementById('volume-slider');
        const icon = document.getElementById('music-icon');
        let isMusicPlaying = true;
        let currentTrack = 'main';

        function toggleVolumePanel() {
            const panel = document.getElementById('volume-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('flex');
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
                playCurrentTrack();
            } else {
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
                audioMain.pause();
                audioPro.pause();
                audioZlo.pause();
            }
        }

        function playCurrentTrack() {
            if (!isMusicPlaying) return;
            audioMain.pause();
            audioPro.pause();
            audioZlo.pause();

            if (isZloMode) {
                audioZlo.play().catch(e => console.log("Автоплей ожидает взаимодействия"));
            } else if (currentTrack === 'main') {
                audioMain.play().catch(e => console.log("Автоплей ожидает взаимодействия"));
            } else {
                audioPro.play().catch(e => console.log("Автоплей ожидает взаимодействия"));
            }
        }

        function switchMusicTo(track) {
            currentTrack = track;
            playCurrentTrack();
        }

        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value;
            audioMain.volume = vol;
            audioPro.volume = vol;
            audioZlo.volume = vol;
        });

        window.onload = () => {
            renderWidget();
            checkHolidayAndSetQuote();
            
            audioMain.volume = volumeSlider.value;
            audioPro.volume = volumeSlider.value;
            audioZlo.volume = volumeSlider.value;

            playCurrentTrack();
        };
    </script>
</body>

    <!-- Ретро-модальное окно -->
    <div id="retro-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div class="max-w-5xl w-full flex flex-col md:flex-row items-end justify-between gap-8 h-[80vh]">
            
            <div class="retro-window w-full md:w-1/2 h-[500px] flex flex-col shadow-[10px_10px_0px_rgba(220,38,38,0.5)] transform scale-95 transition-transform duration-300" id="retro-window-anim">
                
                <div class="retro-title-bar justify-between">
                    <div class="flex items-center space-x-2">
                        <button onclick="closeModal()" class="retro-btn w-6 h-6 flex items-center justify-center text-white text-sm">X</button>
                        <span id="modal-title-name" class="tracking-wide">Имя злодея</span>
                    </div>
                    <div class="flex space-x-1">
                        <div class="retro-btn w-6 h-6 flex items-center justify-center text-white text-xs">▲</div>
                        <div class="retro-btn w-6 h-6 flex items-center justify-center text-white text-xs">▼</div>
                    </div>
                </div>

                <div class="p-3 flex-grow flex flex-col">
                    <div class="font-bold text-sm mb-4 text-red-400" id="modal-debut">ИСТОЧНИК: Текст</div>
                    
                    <div class="retro-content-box flex-grow p-3 text-sm leading-relaxed" id="modal-text-content"></div>
                </div>

                <div class="flex p-1 bg-[#2b0b30] border-t-2 border-[#581c87]">
                    <button id="tab-desc" onclick="switchTab('desc')" class="retro-btn active-tab px-4 py-1 text-sm mr-1">Описание</button>
                    <button id="tab-notes" onclick="switchTab('notes')" class="retro-btn px-4 py-1 text-sm">Заметки</button>
                </div>
            </div>

            <div class="w-full md:w-1/2 h-full flex items-end justify-center pointer-events-none">
                <img id="modal-character-img" src="" alt="Злодей" class="max-h-[90%] w-auto object-contain animate-float drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">
            </div>

        </div>
    </div>

    <!-- Модалка для избранного в режиме злодея -->
    <div id="zlo-fav-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border-4 border-red-600 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center relative overflow-hidden flex flex-col items-center space-y-6">
            <h3 class="text-2xl font-black text-red-500 uppercase">Ты точно уверен, что хочешь туда?</h3>
            <div class="flex justify-center space-x-6 w-full pt-4">
                <button onclick="zloFavChoice('yes')" class="bg-red-700 hover:bg-red-600 text-white font-bold px-6 py-3 rounded-xl cursor-pointer shadow-lg transition-all">Да</button>
                <button onclick="zloFavChoice('no')" class="bg-gray-700 hover:bg-gray-600 text-white font-bold px-6 py-3 rounded-xl cursor-pointer shadow-lg transition-all">Нет</button>
            </div>
            <p id="zlo-fav-result" class="text-yellow-400 font-bold text-lg hidden mt-2">Избранных нет, здесь правят злодеи!</p>
        </div>
    </div>

    <!-- Плашка выхода из режима злодея -->
    <div id="zlo-exit-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border-4 border-purple-500 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center relative overflow-hidden flex flex-col items-center space-y-6">
            <h3 class="text-2xl font-black text-purple-300 uppercase">А ведь все же художник... Ты точно хочешь уйти к этим лузерам?</h3>
            <div class="flex justify-center space-x-6 w-full pt-4">
                <button onclick="zloExitChoice('stay')" class="bg-purple-700 hover:bg-purple-600 text-white font-bold px-4 py-3 rounded-xl cursor-pointer shadow-lg transition-all">Нет, остаться со злодеями</button>
                <button onclick="zloExitChoice('leave')" class="bg-gray-700 hover:bg-gray-600 text-white font-bold px-4 py-3 rounded-xl cursor-pointer shadow-lg transition-all">Да, вернуться к художникам</button>
            </div>
        </div>
    </div>

    <script>
        const ITEMS_PER_PAGE = 18;
        let currentPage = 0;
        let searchQuery = '';

        function renderWidget() {
            const grid = document.getElementById('widget-grid');
            grid.innerHTML = '';
            
            const filtered = VillainsData.filter(item => {
                if (!searchQuery) return true;
                const name = item.name.toLowerCase();
                return name.startsWith(searchQuery) || name.includes(searchQuery);
            });

            const start = currentPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageItems = filtered.slice(start, end);

            if (pageItems.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-red-400 font-bold py-8">Злодеи не найдены!</div>`;
                return;
            }

            pageItems.forEach(item => {
                const elem = document.createElement('div');
                elem.className = "flex flex-col items-center cursor-pointer group";
                elem.onclick = () => openModal(item.id);
                elem.innerHTML = `
                    <div class="w-16 h-16 rounded-xl overflow-hidden border-2 border-red-600 shadow-md group-hover:border-red-400 group-hover:scale-110 transition-all bg-black">
                        <img src="${item.avatar}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/511252/ffffff?text=Ava'">
                    </div>
                    <span class="text-xs font-bold text-red-200 mt-1 text-center leading-tight line-clamp-2">${item.name}</span>
                `;
                grid.appendChild(elem);
            });
        }

        function filterEntities() {
            searchQuery = document.getElementById('artist-search').value.trim().toLowerCase();
            currentPage = 0;
            renderWidget();
            if (searchQuery.includes("а ведь все же художник")) {
                document.getElementById('zlo-exit-modal').classList.remove('hidden');
            }
        }

        function nextPage() {
            const filtered = VillainsData.filter(item => {
                if (!searchQuery) return true;
                return item.name.toLowerCase().includes(searchQuery);
            });
            if ((currentPage + 1) * ITEMS_PER_PAGE < filtered.length) {
                currentPage++;
                renderWidget();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderWidget();
            }
        }

        let currentEntityData = null;
        let currentTab = 'desc';

        function openModal(id) {
            currentEntityData = VillainsData.find(a => a.id === id);
            if (!currentEntityData) return;

            document.getElementById('modal-title-name').textContent = currentEntityData.name;
            document.getElementById('modal-debut').textContent = "ИСТОЧНИК: " + currentEntityData.debut;
            document.getElementById('modal-character-img').src = currentEntityData.fullImage;
            
            switchTab('desc');

            const modal = document.getElementById('retro-modal');
            const windowAnim = document.getElementById('retro-window-anim');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                windowAnim.classList.remove('scale-95');
                windowAnim.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('retro-modal');
            const windowAnim = document.getElementById('retro-window-anim');
            
            modal.classList.add('opacity-0');
            windowAnim.classList.remove('scale-100');
            windowAnim.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function switchTab(tabName) {
            currentTab = tabName;
            const contentBox = document.getElementById('modal-text-content');
            const btnDesc = document.getElementById('tab-desc');
            const btnNotes = document.getElementById('tab-notes');

            if (tabName === 'desc') {
                contentBox.innerHTML = currentEntityData.desc;
                btnDesc.classList.add('active-tab');
                btnNotes.classList.remove('active-tab');
            } else {
                contentBox.innerHTML = currentEntityData.notes;
                btnNotes.classList.add('active-tab');
                btnDesc.classList.remove('active-tab');
            }
        }

        function handleFavWorksClick(event) {
            event.preventDefault();
            document.getElementById('zlo-fav-modal').classList.remove('hidden');
            document.getElementById('zlo-fav-result').classList.add('hidden');
        }

        function zloFavChoice(choice) {
            if (choice === 'yes') {
                const res = document.getElementById('zlo-fav-result');
                res.classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('zlo-fav-modal').classList.add('hidden');
                }, 2000);
            } else {
                document.getElementById('zlo-fav-modal').classList.add('hidden');
            }
        }

        function zloExitChoice(choice) {
            if (choice === 'leave') {
                window.location.href = "index.html"; // Возврат к обычным художникам
            } else {
                document.getElementById('zlo-exit-modal').classList.add('hidden');
            }
        }

        // Музыка (сразу играет zlo.mp3)
        const audioZlo = document.getElementById('music-zlo');
        const volumeSlider = document.getElementById('volume-slider');
        const icon = document.getElementById('music-icon');
        let isMusicPlaying = true;

        function toggleVolumePanel() {
            const panel = document.getElementById('volume-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('flex');
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                icon.classList.remove('fa-volume-xmark');
                icon.classList.add('fa-volume-high');
                audioZlo.play().catch(e => console.log("Автоплей ожидает взаимодействия"));
            } else {
                icon.classList.remove('fa-volume-high');
                icon.classList.add('fa-volume-xmark');
                audioZlo.pause();
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            audioZlo.volume = e.target.value;
        });

        window.onload = () => {
            renderWidget();
            audioZlo.volume = volumeSlider.value;
            audioZlo.play().catch(e => console.log("Автоплей ожидает взаимодействия"));

            const randomVillainQuote = VillainQuotes[Math.floor(Math.random() * VillainQuotes.length)];
            document.getElementById('daily-quote-text').textContent = `«${randomVillainQuote}»`;
        };
    </script>
</body>
</html>

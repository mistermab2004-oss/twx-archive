    <title>TWX Список</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #000000 url('user/system/popu.png') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
            user-select: none;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }

        /* Эффект прожатой/вдавленной кнопки списка */
        .list-tab-btn {
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            padding: 8px 10px;
            border-radius: 4px;
            text-align: center;
        }
        .list-tab-btn:hover {
            filter: brightness(1.1);
        }
        .list-tab-btn.pressed, .list-tab-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), 0 1px 2px rgba(0,0,0,0.2) !important;
            filter: brightness(0.85);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Кнопки подблоков (внутри категорий вроде Реакций или Другого) */
        .sub-tab-btn {
            transition: all 0.1s ease;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #1a1a1a;
            color: #bbb;
        }
        .sub-tab-btn:hover {
            background: #333;
            color: #fff;
        }
        .sub-tab-btn.active-sub {
            background: #e11d48;
            color: #fff;
            border-color: #f43f5e;
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
        }

        /* Эффект свечения и подъема постеров */
        .poster-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        /* Квадратный ползунок звука как молния */
        input[type=range] {
            -webkit-appearance: none;
            background: #222;
            height: 8px;
            border-radius: 2px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.9);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(0.85);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-black">

    <!-- 🎵 АУДИОПЛЕЕР (Фоновая музыка) -->
    <audio id="bg-music" src="user/music/popy.mp3" loop></audio>

    <!-- 🔝 УНИКАЛЬНАЯ ШАПКА СТРАНИЦЫ СПИСКА -->
    <header class="bg-black/90 border-b border-white/20 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-col xl:flex-row items-center justify-between px-4 py-3 gap-4">
            
            <!-- Левый блок: Кнопка музыки + Главная -->
            <div class="flex items-center space-x-3 w-full xl:w-auto justify-between xl:justify-start">
                <div class="flex items-center space-x-2">
                    <button id="music-toggle-btn" onclick="toggleMusic()" class="w-10 h-10 bg-[#1a1a1a] border border-white/30 rounded flex items-center justify-center text-white hover:bg-[#333] transition cursor-pointer shadow-lg active:scale-95" title="Включить/Выключить музыку">
                        <i id="music-icon" class="fa-solid fa-music text-sm"></i>
                    </button>
                    <div class="flex items-center bg-[#111] px-2 py-1.5 rounded border border-white/20">
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="setVolume(this.value)" class="w-24 cursor-pointer" title="Громкость">
                    </div>
                </div>

                <a href="index.html" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded border border-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.5)] transition active:translate-y-0.5">
                    <i class="fa-solid fa-house mr-1"></i> ГЛАВНАЯ
                </a>
            </div>

            <!-- Правый блок: 10 Кнопок списков -->
            <nav class="flex flex-wrap items-center justify-center gap-1.5">
                <button id="btn-passed" onclick="switchList('passed')" class="list-tab-btn bg-orange-600 text-white">Пройденные</button>
                <button id="btn-party" onclick="switchList('party')" class="list-tab-btn bg-yellow-500 text-black">На вечерок</button>
                <button id="btn-unpassed" onclick="switchList('unpassed')" class="list-tab-btn bg-red-600 text-white">Не пройденные</button>
                <button id="btn-debts" onclick="switchList('debts')" class="list-tab-btn bg-blue-600 text-white">Долги</button>
                <button id="btn-reactions" onclick="switchList('reactions')" class="list-tab-btn bg-purple-600 text-white">Реакции</button>
                <button id="btn-fnf" onclick="switchList('fnf')" class="list-tab-btn bg-pink-600 text-white">ФНФ</button>
                <button id="btn-mods" onclick="switchList('mods')" class="list-tab-btn bg-cyan-600 text-white">Моды</button>
                <button id="btn-comics" onclick="switchList('comics')" class="list-tab-btn bg-indigo-600 text-white">Комиксы</button>
                <button id="btn-abandoned" onclick="switchList('abandoned')" class="list-tab-btn bg-amber-600 text-white">Заброшенные</button>
                <button id="btn-unlikely" onclick="switchList('unlikely')" class="list-tab-btn bg-emerald-700 text-white">Врядли</button>
                <button id="btn-other" onclick="switchList('other')" class="list-tab-btn bg-gray-700 text-white">Другое</button>
            </nav>
        </div>
    </header>

    <!-- 🎯 ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-7xl mx-auto w-full px-4 py-8 flex-grow">
        <!-- Название активного списка сверху -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-white/20 pb-4 gap-4">
            <div>
                <h1 id="active-list-title" class="text-3xl font-black text-white tracking-wider uppercase">Игры которые играли</h1>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                <!-- Контейнер для динамических подменю (подблоков) -->
                <div id="sub-tabs-container" class="flex flex-wrap gap-2 hidden"></div>
                <span id="list-count" class="text-xs text-gray-400 font-mono whitespace-nowrap">Элементов: 0</span>
            </div>
        </div>

        <!-- Сетка 5 столбцов -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4" id="poster-grid">
            <!-- Динамически заполняется через JS -->
        </div>
    </main>

    </footer>

           ======================================================================== */
        function switchList(key) {
            currentMainKey = key;
            currentSubKey = null;

            document.querySelectorAll('.list-tab-btn').forEach(btn => btn.classList.remove('pressed'));
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) activeBtn.classList.add('pressed');

            const subContainer = document.getElementById('sub-tabs-container');
            subContainer.innerHTML = '';
            subContainer.classList.add('hidden');

	    if (key === 'reactions') {
                subContainer.classList.remove('hidden');
                subContainer.innerHTML = `
                    <button onclick="switchSubList('reactions', 'toFilm')" id="sub-btn-toFilm" class="sub-tab-btn">Надо снять</button>
                    <button onclick="switchSubList('reactions', 'filmed')" id="sub-btn-filmed" class="sub-tab-btn">Отснятые</button>
                `;
                switchSubList('reactions', 'toFilm');
                return;
            }

            if (key === 'other') {
                subContainer.classList.remove('hidden');
                subContainer.innerHTML = `
                    <button onclick="switchSubList('other', 'castle')" id="sub-btn-castle" class="sub-tab-btn">Замок</button>
                    <button onclick="switchSubList('other', 'characters')" id="sub-btn-characters" class="sub-tab-btn">Персонажи</button>
                    <button onclick="switchSubList('other', 'hunterTries')" id="sub-btn-hunterTries" class="sub-tab-btn">Хантер пробует</button>
                    <button onclick="switchSubList('other', 'cities')" id="sub-btn-cities" class="sub-tab-btn">Города</button>
                    <button onclick="switchSubList('other', 'gratitude')" id="sub-btn-gratitude" class="sub-tab-btn">Благодарности</button>
                    <button onclick="switchSubList('other', 'films')" id="sub-btn-films" class="sub-tab-btn">Фильмы</button>
                    <button onclick="switchSubList('other', 'interesting')" id="sub-btn-interesting" class="sub-tab-btn">Самое интересное</button>
                    <button onclick="switchSubList('other', 'prazdnik')" id="sub-btn-prazdnik" class="sub-tab-btn">Новый Год</button>
                    <button onclick="switchSubList('other', 'doso')" id="sub-btn-doso" class="sub-tab-btn">Достопримечательности</button>
                    <button onclick="switchSubList('other', 'otherActivity')" id="sub-btn-otherActivity" class="sub-tab-btn">Другая деятельность</button>
                `;
                switchSubList('other', 'castle');
                return;
            }

            document.getElementById('active-list-title').textContent = ListTitles[key];
            renderGrid(GameLists[key] || []);
        }

        function switchSubList(mainKey, subKey) {
            currentSubKey = subKey;
            
            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active-sub'));
            const activeSubBtn = document.getElementById(`sub-btn-${subKey}`);
            if (activeSubBtn) activeSubBtn.classList.add('active-sub');

            document.getElementById('active-list-title').textContent = SubListTitles[subKey];
            
            const dataObj = GameLists[mainKey];
            if (dataObj && dataObj[subKey]) {
                renderGrid(dataObj[subKey]);
            } else {
                renderGrid([]);
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('poster-grid');
            grid.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "poster-card relative bg-[#111] rounded border border-white/20 overflow-hidden flex flex-col justify-between cursor-pointer shadow-xl";
                
                card.onclick = () => {
                    window.open(item.link, '_blank');
                };

                // Логика плашек (статусы прохождения для FNF или желтая плашка "Утерено" zozz)
                let badgeHTML = '';
                if (item.status) {
                    let bgClass = 'bg-gray-600';
                    let text = 'В планах';
                    
                    if (item.status === 'xox') {
                        bgClass = 'bg-emerald-600';
                        text = 'Пройден';
                    } else if (item.status === 'yoyu') {
                        bgClass = 'bg-red-600';
                        text = 'Заброшен';
                    } else if (item.status === 'opop') {
                        bgClass = 'bg-gray-500';
                        text = 'В планах';
                    } else if (item.status === 'zozz') {
                        bgClass = 'bg-yellow-500 text-black font-black animate-pulse';
                        text = 'Утеряно';
                    } else if (item.status === 'ccc') {
                        bgClass = 'bg-purple-500';
                        text = '1 серия';
                    } else if (item.status === 'mmm') {
                        bgClass = 'bg-purple-500';
                        text = '2 серии';
                    } else if (item.status === 'vvv') {
                        bgClass = 'bg-purple-500';
                        text = '3 серии';
                    } else if (item.status === 'xax') {
                        bgClass = 'bg-purple-500';
                        text = '4 серии';
                    } else if (item.status === 'lol') {
                        bgClass = 'bg-purple-500';

        const music = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');
        const volumeSlider = document.getElementById('volume-slider');

        music.volume = 0.5;

        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => {
                    musicIcon.className = "fa-solid fa-music text-sm";
                }).catch(e => console.log("Требуется взаимодействие"));
            } else {
                music.pause();
                musicIcon.className = "fa-solid fa-music-slash text-sm text-red-400";
            }
        }

        function setVolume(val) {
            music.volume = val;
            if (val == 0) {
                musicIcon.className = "fa-solid fa-volume-xmark text-sm text-red-400";
            } else {
                musicIcon.className = "fa-solid fa-volume-high text-sm";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchList('passed');

            music.play().then(() => {
                musicIcon.className = "fa-solid fa-music text-sm";
            }).catch(() => {
                const unlockAudio = () => {
                    music.play().then(() => {
                        musicIcon.className = "fa-solid fa-music text-sm";
                        window.removeEventListener('click', unlockAudio);
                        window.removeEventListener('keydown', unlockAudio);
                    });
                };
                window.addEventListener('click', unlockAudio);
                window.addEventListener('keydown', unlockAudio);
            });
        });

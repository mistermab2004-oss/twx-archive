        /* ⚡ КРОВАВО-ФИОЛЕТОВЫЙ ПОЛЗУНОК-МОЛНИЯ (Скроллбар) ⚡ */
        ::-webkit-scrollbar { width: 20px; }
        ::-webkit-scrollbar-track {
            background: #1f0524;
            border-left: 3px dashed #dc2626;
            border-right: 3px dashed #dc2626;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #dc2626 0%, #9333ea 50%, #581c87 100%);

            box-shadow: inset 0 2px 5px rgba(255,255,255,0.6), 0 0 10px rgba(220, 38, 38, 0.6);
            min-height: 50px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #ef4444 0%, #a855f7 50%, #6b21a8 100%);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8), 0 0 15px rgba(220, 38, 38, 0.9);
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-avatar {
            animation: popIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #ef4444;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Эффект линованной тетради для истории */
        .notebook-paper {
            background: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #991b1b 31px,

            );

        }

        /* Анимация частиц для лайка и кубка */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: floatUpAndFade 1.2s ease-out forwards;
        }
        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 100px)) scale(1.4) rotate(var(--rot));
            }
        }
    </style>

    <script>
        const monthNames = {'01':'Января','02':'Февраля','03':'Марта','04':'Апреля','05':'Мая','06':'Июня','07':'Июля','08':'Августа','09':'Сентября','10':'Октября','11':'Ноября','12':'Декабря'};
        const modeTitles = {'all':'НАШИ ШЕДЕВРЫ TWX','classic':'КЛАССИКА','plagiarist':'ПЛАГИАТ','history':'ИСТОРИЯ'};
        const modeCategoryNames = {'classic':'Классика','plagiarist':'Плагиат','history':'История'};
        
        let dbItems = [];
        let currentAccountIdx = 0;
        let currentSubProfileIdx = 0;
        let currentMode = 'all';
        let selectedFilterDate = null;
        let currentDisplayedItems = [];
        let currentModalIdx = 0;
        let typingTimer;

        // Покраска и анимация элементов
        function updateMusicUI(playing) {
            const btnText = document.getElementById('musicText');
            const btnIcon = document.getElementById('musicIcon');
            if (playing) {
                btnText.textContent = 'Музыка: Вкл';
                btnIcon.className = 'fas fa-pause';
            } else {
                btnText.textContent = 'Музыка: Выкл';
                btnIcon.className = 'fas fa-play';
            }
        }

        function toggleMusic() {
            const audio = document.getElementById('bgMusic');
            if (audio.paused) {
                audio.play().then(() => updateMusicUI(true)).catch(err => console.log("Ошибка воспроизведения:", err));
            } else {
                audio.pause();
                updateMusicUI(false);
            }
        }

        function updateVolume(value) {
            const audio = document.getElementById('bgMusic');
            if (audio) audio.volume = parseFloat(value);
        }

        // Обновление фиолетового квадратика со счетчиком главных авторов
        function updateAuthorsCounter() {
            const el = document.getElementById('authorsCountDisplay');
            if(el) el.textContent = KatyaGallery.length;
        }

        // Поиск злодея
        function handleSearchInput(query) {
            const dropdown = document.getElementById('searchResultsDropdown');
            const q = query.trim().toLowerCase();
            
            if (!q) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                return;
            }

            let results = [];
            KatyaGallery.forEach((acc, aIdx) => {
                acc.subProfiles.forEach((sub, sIdx) => {
                    let name = sub.subName ? sub.subName : acc.accountName;
                    if (name.toLowerCase().includes(q)) {
                        let avatar = sub.avatar ? sub.avatar : acc.avatar;
                        results.push({ aIdx, sIdx, name, avatar });
                    }
                });
            });

            if (results.length === 0) {
                dropdown.innerHTML = '<div class="p-3 text-xs text-red-400 text-center font-bold">Злодей не найден в тенях...</div>';
                dropdown.classList.remove('hidden');
                return;
            }

            let html = '';
            results.forEach(res => {
                html += `
                    <div onclick="selectArtist(${res.aIdx}, ${res.sIdx})" class="flex items-center space-x-3 p-2.5 hover:bg-red-950 cursor-pointer transition-all">
                        <div class="w-10 h-10 rounded-full border-2 border-red-600 overflow-hidden shrink-0 bg-black flex items-center justify-center">
                            <img src="user/zlo/${res.avatar}" alt="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/511252/ffffff?text=Ava'">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-red-400 font-black text-xs">${res.name}</span>
                            <span class="text-[10px] text-red-300">Злодей / Профиль</span>
                        </div>
                    </div>
                `;
            });

            dropdown.innerHTML = html;
            dropdown.classList.remove('hidden');
        }

        function selectArtist(aIdx, sIdx) {
            currentAccountIdx = aIdx;
            currentSubProfileIdx = sIdx;
            document.getElementById('searchResultsDropdown').classList.add('hidden');
            document.getElementById('artistSearchInput').value = '';
            triggerAvatarAnimationAndSwitch();
        }

        document.addEventListener('click', (e) => {
            const searchInput = document.getElementById('artistSearchInput');
            if (searchInput && !searchInput.parentNode.contains(e.target)) {
                document.getElementById('searchResultsDropdown').classList.add('hidden');
            }
        });

        function buildInternalDatabase() {
            dbItems = [];
            
            KatyaGallery.forEach((acc, aIdx) => {
                let categoryCounters = {}; // Подсчет нумерации по категориям
                
                acc.subProfiles.forEach((sub, sIdx) => {
                    for (let mode in sub.modes) {
                        for (let dateRaw in sub.modes[mode]) {
                            let parts = dateRaw.split('/');
                            let dateObj = { raw: dateRaw, day: parts[0], month: parts[1], year: (parts[2].length===2?"20"+parts[2]:parts[2]) };
                            
                            sub.modes[mode][dateRaw].forEach(fileData => {
                                if(!categoryCounters[mode]) categoryCounters[mode] = 0;
                                categoryCounters[mode]++;
                                let num = categoryCounters[mode];

                                let item = { aIdx, sIdx, mode, dateObj, type: mode === 'history' ? 'history' : 'image', num };
                                
                                // Позиционирование названий: Работа [Категория] [Имя] №X
                                const authorName = sub.subName ? sub.subName : acc.accountName;
                                if (item.type === 'history') {
                                    item.title = `Запись Истории ${authorName} №${num}`;
                                    item.text = fileData.text;
                                } else {
                                    let catName = modeCategoryNames[mode] || 'Работа';
                                    item.title = `Работа ${catName} ${authorName} №${num}`;
                                    item.image = `user/zlo/art/${fileData}`;
                                }
                                item.uniqueId = `${aIdx}_${sIdx}_${mode}_${num}`;
                                dbItems.push(item);
                            });
                        }
                    }
                });
            });
        }

        function tryPlayAudio() {
            const audio = document.getElementById('bgMusic');
            if (!audio) return;
            audio.volume = document.getElementById('volumeControl').value;
            const promise = audio.play();

            if (promise !== undefined) {
                promise.then(() => {
                    updateMusicUI(true);
                    removeInteractionListeners();
                }).catch(() => {
                    updateMusicUI(false);
                    addInteractionListeners();
                });
            }
        }

        function onUserInteraction() {
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().then(() => {
                    updateMusicUI(true);
                    removeInteractionListeners();
                }).catch(e => console.log(e));
            }
        }

        function addInteractionListeners() {
            document.addEventListener('click', onUserInteraction);
            document.addEventListener('keydown', onUserInteraction);
            document.addEventListener('touchstart', onUserInteraction);
        }

        function removeInteractionListeners() {
            document.removeEventListener('click', onUserInteraction);
            document.removeEventListener('keydown', onUserInteraction);
            document.removeEventListener('touchstart', onUserInteraction);
        }

        function initPage() {
            buildInternalDatabase();
            updateAuthorsCounter();
            if(KatyaGallery.length > 0) switchAccount(0);
            tryPlayAudio();
        }

        function nextMainAccount() {
            currentAccountIdx = (currentAccountIdx + 1) % KatyaGallery.length;
            switchAccount(currentAccountIdx);
        }

        function prevMainAccount() {
            currentAccountIdx = (currentAccountIdx - 1 + KatyaGallery.length) % KatyaGallery.length;
            switchAccount(currentAccountIdx);
        }

        function nextSubProfile() {
            const subsLength = KatyaGallery[currentAccountIdx].subProfiles.length;
            if (subsLength > 1) {
                currentSubProfileIdx = (currentSubProfileIdx + 1) % subsLength;
                triggerAvatarAnimationAndSwitch();
            }
        }

        function prevSubProfile() {
            const subsLength = KatyaGallery[currentAccountIdx].subProfiles.length;
            if (subsLength > 1) {
                currentSubProfileIdx = (currentSubProfileIdx - 1 + subsLength) % subsLength;
                triggerAvatarAnimationAndSwitch();
            }
        }

        function triggerAvatarAnimationAndSwitch() {
            const avatarImg = document.getElementById('mainAvatarImg');
            avatarImg.classList.remove('animate-avatar');
            void avatarImg.offsetWidth; 
            avatarImg.classList.add('animate-avatar');
            switchSubProfile(currentSubProfileIdx);
        }

        function typeWriterEffect(text) {
            const el = document.getElementById('subAccountName');
            el.innerHTML = '';
            clearTimeout(typingTimer);
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    typingTimer = setTimeout(type, 40);
                }
            }
            type();
        }

        function switchAccount(idx) {
            currentAccountIdx = parseInt(idx);
            currentSubProfileIdx = 0; 
            triggerAvatarAnimationAndSwitch(); 
        }

        function updateAuthorTrophyUI() {
            const authorKey = `trophies_author_${currentAccountIdx}`;
            const trophyCount = parseInt(localStorage.getItem(authorKey) || '0');
            const badge = document.getElementById('authorTrophyBadge');
            const tooltip = document.getElementById('trophyTooltip');
            
            if (trophyCount > 0) {
                badge.classList.remove('hidden');
                tooltip.textContent = `Награды автора: ${trophyCount} кубков`;
            } else {
                badge.classList.add('hidden');
            }
        }

        function switchSubProfile(idx) {
            currentSubProfileIdx = parseInt(idx);
            selectedFilterDate = null;
            
            const acc = KatyaGallery[currentAccountIdx];
            const sub = acc.subProfiles[currentSubProfileIdx];
            
            const avatarToUse = sub.avatar ? sub.avatar : acc.avatar;
            document.getElementById('mainAvatarImg').src = `user/zlo/${avatarToUse}`;
            
            let mainName = sub.subName ? sub.subName : acc.accountName;
            document.getElementById('mainAccountName').textContent = mainName;
            
            let desc = sub.subDir === "" ? "ГЛАВНЫЙ ЗЛОДЕЙ" : "АЛЬТЕРНАТИВНАЯ ФОРМА";
            typeWriterEffect(desc);

            updateAuthorTrophyUI();
            renderGrid();
        }

        function switchMode(mode) {
            currentMode = mode; selectedFilterDate = null;
            document.getElementById('page-title').textContent = modeTitles[mode] || 'РАБОТЫ';
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = btn.getAttribute('data-mode') === mode 
                    ? "mode-btn px-4 py-1.5 rounded-xl text-xs font-black border-2 border-red-950 shadow transition-all bg-red-600 text-white"
                    : "mode-btn px-4 py-1.5 rounded-xl text-xs font-black border-2 border-red-950 shadow transition-all bg-gray-900 text-red-300 hover:bg-red-950";
            });
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('artworks-grid');
            container.innerHTML = '';

            let items = dbItems.filter(i => i.aIdx === currentAccountIdx && i.sIdx === currentSubProfileIdx);
            if (currentMode !== 'all') items = items.filter(i => i.mode === currentMode);
            if (selectedFilterDate) items = items.filter(i => i.dateObj.raw === selectedFilterDate);

            currentDisplayedItems = items;

            if (items.length === 0) {
                container.innerHTML = '<div class="text-center text-red-400 py-10 font-bold">В архивах злодея пока пусто...</div>';
                return;
            }

            if (currentMode === 'all') {
                let groups = {};
                items.forEach(item => {
                    let k = item.dateObj.raw;
                    if(!groups[k]) groups[k] = { d: item.dateObj, arr: [] };
                    groups[k].arr.push(item);
                });
                
                Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(key => {
                    let g = groups[key];
                    let dateLabel = `${g.d.day} ${monthNames[g.d.month]} ${g.d.year} г.`;
                    let blockDiv = document.createElement('div');
                    blockDiv.className = "mb-6";
                    blockDiv.innerHTML = `<div class="flex items-center space-x-4 mb-4"><span class="bg-red-950 text-red-400 px-4 py-1.5 rounded-xl font-black text-sm border-2 border-red-700 shadow uppercase">📅 ${dateLabel}</span><div class="flex-grow border-b-2 border-dashed border-red-600/50"></div></div>`;
                    let grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6";
                    g.arr.forEach(it => grid.appendChild(createCardElement(it)));
                    blockDiv.appendChild(grid); container.appendChild(blockDiv);
                });
            } else {
                let grid = document.createElement('div');
                grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6";
                items.forEach(it => grid.appendChild(createCardElement(it)));
                container.appendChild(grid);
            }
        }

        function createCardElement(item) {
            const card = document.createElement('div');
            const dateStr = `${item.dateObj.day} ${monthNames[item.dateObj.month]} ${item.dateObj.year}`;
            const idx = currentDisplayedItems.indexOf(item);

            if (item.type === 'history') {
                card.className = "bg-gray-950 rounded-2xl shadow-xl overflow-hidden border-4 border-red-800 flex flex-col justify-between p-4 transform hover:-translate-y-1 transition-all duration-300 relative group cursor-pointer aspect-square text-red-200";
                card.innerHTML = `
                    <div class="w-full h-full overflow-y-auto font-bold text-sm p-2 flex flex-col" onclick="openFullSizeModal(${idx})">
                        <span class="text-xs text-red-400 font-black mb-1">✍️ ${item.title}</span>
                        <p class="text-xs font-handwriting text-red-200 line-clamp-4 leading-snug">${item.text}</p>
                    </div>
                    <div class="mt-2 text-[10px] text-red-400 flex justify-between items-center border-t border-red-900/50 pt-2">
                        <span class="bg-red-900 text-white px-2 py-0.5 rounded font-bold">${dateStr}</span>
                    </div>
                `;
            } else {
                card.className = "bg-black/95 rounded-2xl shadow-xl overflow-hidden border-4 border-red-800 flex flex-col justify-between transform hover:-translate-y-1 transition-all relative group cursor-pointer aspect-square";
                card.innerHTML = `
                    <div class="flex-grow overflow-hidden bg-gray-900 relative" onclick="openFullSizeModal(${idx})">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform" onerror="this.src='https://placehold.co/300x200/220000/ff0000?text=Файл+не+найден'">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-red-400 font-bold text-sm">Осмотреть 🔍</div>
                    </div>
                    <div class="p-3 bg-red-950 text-white font-bold text-xs truncate flex items-center justify-between px-4">
                        <span class="truncate">${item.title}</span>
                        <span class="text-[10px] bg-red-700 px-2 py-0.5 rounded font-bold">${dateStr}</span>
                    </div>
                `;
            }
            return card;
        }

        // =======================================================================
        // 🔮 ЛОГИКА ПРОСМОТРА СТРЕЛОК, ЛАЙКОВ, ДИЗЛАЙКОВ И КУБКА 🔮
        // =======================================================================
        
        function openFullSizeModal(idx) {
            currentModalIdx = idx;
            updateModalContent();
            document.getElementById('fullsize-modal').classList.add('flex');
            document.getElementById('fullsize-modal').classList.remove('hidden');
        }

        function updateModalContent() {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            document.getElementById('fullsize-title').textContent = item.title;
            document.getElementById('fullsize-year').textContent = `📅 Дата: ${item.dateObj.day} ${monthNames[item.dateObj.month]} ${item.dateObj.year} г.`;
            
            const container = document.getElementById('fullsize-content-container');
            if (item.type === 'history') {
                // Рукописный стиль тетради с прочерками
                container.innerHTML = `
                    <div class="notebook-paper text-red-100 font-handwriting text-xl md:text-2xl w-full max-h-[50vh] overflow-y-auto p-4 leading-[32px] tracking-wide">
                        <span class="text-2xl mr-2">✍️</span>${item.text}
                    </div>
                `;
            } else {
                container.innerHTML = `<img src="${item.image}" alt="${item.title}" class="max-w-full max-h-[50vh] w-auto h-auto object-contain rounded-xl shadow-2xl">`;
            }

            // Обновление состояния стрелочек
            const prevBtn = document.getElementById('modalPrevBtn');
            const nextBtn = document.getElementById('modalNextBtn');

            if (currentModalIdx === 0) {
                prevBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                prevBtn.classList.remove('hover:scale-110');
            } else {
                prevBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                prevBtn.classList.add('hover:scale-110');
            }

            if (currentModalIdx === currentDisplayedItems.length - 1) {
                nextBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                nextBtn.classList.remove('hover:scale-110');
            } else {
                nextBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                nextBtn.classList.add('hover:scale-110');
            }

            // Обновление кнопок реакций для текущей работы
            updateReactionsUI();
        }

        function navigateModal(direction) {
            let newIdx = currentModalIdx + direction;
            if (newIdx >= 0 && newIdx < currentDisplayedItems.length) {
                currentModalIdx = newIdx;
                updateModalContent();
            }
        }

        function updateReactionsUI() {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const reactKey = `react_${item.uniqueId}`;
            const userReaction = localStorage.getItem(reactKey); // 'like', 'dislike', or null

            const likeIcon = document.getElementById('likeIcon');
            const dislikeIcon = document.getElementById('dislikeIcon');

            if (userReaction === 'like') {
                likeIcon.textContent = '❤️';
                dislikeIcon.textContent = '💩';
            } else if (userReaction === 'dislike') {
                likeIcon.textContent = '🤍';
                dislikeIcon.textContent = '💩'; // Дизлайк активно проставлен
            } else {
                likeIcon.textContent = '🤍';
                dislikeIcon.textContent = '💩';
            }
        }

        function toggleReaction(type, event) {
            let item = currentDisplayedItems[currentModalIdx];
            if (!item) return;

            const reactKey = `react_${item.uniqueId}`;
            const currentReaction = localStorage.getItem(reactKey);

            if (currentReaction === type) {
                localStorage.removeItem(reactKey);
            } else {
                localStorage.setItem(reactKey, type);
                if (type === 'like') {
                    spawnParticles(event.clientX, event.clientY, ['❤️', '💖', '✨', '💕']);
                }
            }
            updateReactionsUI();
        }

        function awardTrophy(event) {
            const authorKey = `trophies_author_${currentAccountIdx}`;
            let count = parseInt(localStorage.getItem(authorKey) || '0');
            count++;
            localStorage.setItem(authorKey, count);

            spawnParticles(event.clientX, event.clientY, ['🏆', '⭐', '✨', '🎉', '🌟']);
            updateAuthorTrophyUI();
        }

        // Анимация вылетающих звёзд / сердечек / блёсток
        function spawnParticles(x, y, symbols) {
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                
                const dx = (Math.random() - 0.5) * 160 + 'px';
                const rot = (Math.random() - 0.5) * 360 + 'deg';
                
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.setProperty('--dx', dx);
                particle.style.setProperty('--rot', rot);
                particle.style.fontSize = `${16 + Math.random() * 16}px`;

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function closeFullSizeModal() { 
            document.getElementById('fullsize-modal').classList.add('hidden'); 
            document.getElementById('fullsize-modal').classList.remove('flex');
        }

        function openFilterModal() {
            let datesSet = new Set();
            let items = dbItems.filter(i => i.aIdx === currentAccountIdx && i.sIdx === currentSubProfileIdx);
            if (currentMode !== 'all') items = items.filter(i => i.mode === currentMode);
            items.forEach(it => datesSet.add(it.dateObj.raw));

            const listContainer = document.getElementById('filter-years-list');
            listContainer.innerHTML = '';
            if (datesSet.size === 0) {
                listContainer.innerHTML = '<p class="text-xs text-red-400 text-center py-2">Нет дат в архиве</p>';
            } else {
                Array.from(datesSet).sort().reverse().forEach(dateRaw => {
                    let p = dateRaw.split('/'); let dLbl = `${p[0]} ${monthNames[p[1]]} 20${p[2]} г.`;
                    const isSel = selectedFilterDate === dateRaw;
                    const btn = document.createElement('button');
                    btn.className = `w-full py-2.5 px-4 rounded-xl font-bold text-sm cursor-pointer flex justify-between border-2 ${isSel ? 'bg-red-600 text-white border-red-400' : 'bg-black text-red-300 border-red-800'}`;
                    btn.innerHTML = `<span>📅 ${dLbl}</span> ${isSel ? '<span class="text-xs">✓</span>' : ''}`;
                    btn.onclick = () => { selectedFilterDate = dateRaw; renderGrid(); closeFilterModal(); };
                    listContainer.appendChild(btn);
                });
            }
            document.getElementById('filter-modal').classList.add('flex');
            document.getElementById('filter-modal').classList.remove('hidden');
        }

        function closeFilterModal() { 
            document.getElementById('filter-modal').classList.add('hidden'); 
            document.getElementById('filter-modal').classList.remove('flex');
        }

        function applyYearFilter(val) { selectedFilterDate = val; renderGrid(); closeFilterModal(); }

        window.onload = initPage;
    </script>
</body>
</html>
